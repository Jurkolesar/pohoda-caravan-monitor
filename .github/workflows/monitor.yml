name: Pohoda caravan monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to all channels"
        type: boolean
        default: false
permissions:
  actions: write
  contents: write
concurrency: monitor
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shop
        id: check
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "result=FOUND|https://shop.pohodafestival.sk/sk/listky-2027|TEST ALERT - not real yet" >> "$GITHUB_OUTPUT"
          else
            echo "result=$(./check.sh)" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert
        if: startsWith(steps.check.outputs.result, 'FOUND')
        env:
          RESULT: ${{ steps.check.outputs.result }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_LANG: ${{ secrets.WA_LANG }}
        run: |
          URL=$(echo "$RESULT" | cut -d'|' -f2); HIT=$(echo "$RESULT" | cut -d'|' -f3-)
          MSG="🚨 POHODA: Caravan parking ticket is available! Buy it now: $URL  ($HIT)"
          curl -s --max-time 20 -H "Title: POHODA: Caravan ticket available!" -H "Priority: urgent" \
            -H "Tags: rotating_light,camping" -H "Click: $URL" -d "$MSG" "https://n          # WhatsApp via Meta WhatsApp Cloud API (template message; WA_TO may hold several numbers, comma-separated)
          if [ -n "$WA_TOKEN" ] && [ -n "$WA_TO" ]; then
            TPL="${WA_TEMPLATE:-hello_world}"; LANG_CODE="${WA_LANG:-en_US}"
            for to in ${WA_TO//,/ }; do
              if [ "$TPL" = "hello_world" ]; then
                body=$(jq -n --arg to "$to" '{messaging_product:"whatsapp",to:$to,type:"template",template:{name:"hello_world",language:{code:"en_US"}}}')
              else
                body=$(jq -n --arg to "$to" --arg t "$TPL" --arg l "$LANG_CODE" --arg u "$URL" \
                  '{messaging_product:"whatsapp",to:$to,type:"template",template:{name:$t,language:{code:$l},components:[{type:"body",parameters:[{type:"text",text:$u}]}]}}')
              fi
              curl -s --max-time 20 -X POST "https://graph.facebook.com/v21.0/$WA_PHONE_NUMBER_ID/messages" \
                -H "Authorization: Bearer $WA_TOKEN" -H "Content-Type: application/json" -d "$body"; echo
            done
          fi
TOKEN"
          fi
      - name: Stop after a real alert
        if: startsWith(steps.check.outputs.result, 'FOUND') && inputs.test_alert != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable monitor.yml -R "$GITHUB_REPOSITORY"
      - name: Keepalive (GitHub disables schedules after 60 idle days)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt $((40*86400)) ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            date -u > keepalive.txt; git add keepalive.txt; git commit -m "keepalive"; git push
          fi
