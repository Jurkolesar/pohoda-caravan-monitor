name: Pohoda caravan monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to all channels"
        type: boolean
        default: false
permissions:
  actions: write
  contents: write
concurrency: monitor
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shop
        id: check
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "result=FOUND|https://shop.pohodafestival.sk/sk/listky-2027|TEST ALERT - not real yet" >> "$GITHUB_OUTPUT"
          else
            echo "result=$(./check.sh)" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert
        if: startsWith(steps.check.outputs.result, 'FOUND')
        env:
          RESULT: ${{ steps.check.outputs.result }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
        run: |
          URL=$(echo "$RESULT" | cut -d'|' -f2); HIT=$(echo "$RESULT" | cut -d'|' -f3-)
          MSG="🚨 POHODA: Caravan parking ticket is available! Buy it now: $URL  ($HIT)"
          curl -s --max-time 20 -H "Title: POHODA: Caravan ticket available!" -H "Priority: urgent" \
            -H "Tags: rotating_light,camping" -H "Click: $URL" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC"
          if [ -n "$GREENAPI_ID" ] && [ -n "$WHATSAPP_CHAT_ID" ]; then
            jq -n --arg c "$WHATSAPP_CHAT_ID" --arg m "$MSG" '{chatId:$c,message:$m}' | \
            curl -s --max-time 20 -X POST -H "Content-Type: application/json" -d @- \
              "${GREENAPI_URL:-https://api.green-api.com}/waInstance$GREENAPI_ID/sendMessage/$GREENAPI_TOKEN"
          fi
      - name: Stop after a real alert
        if: startsWith(steps.check.outputs.result, 'FOUND') && inputs.test_alert != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable monitor.yml -R "$GITHUB_REPOSITORY"
      - name: Keepalive (GitHub disables schedules after 60 idle days)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt $((40*86400)) ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            date -u > keepalive.txt; git add keepalive.txt; git commit -m "keepalive"; git push
          fi
